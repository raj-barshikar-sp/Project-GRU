[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "henry-dsr-agent"
version = "0.1.0"
description = "Henry, a local-first digital sales representative copilot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SailPoint" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
henry = "henry_dsr_agent.cli:app"

[tool.setuptools]
packages = [
  "henry_dsr_agent",
  "henry_dsr_agent.agents",
  "henry_dsr_agent.api",
  "henry_dsr_agent.config",
  "henry_dsr_agent.orchestrator",
  "henry_dsr_agent.schemas",
  "henry_dsr_agent.tools",
]
package-dir = { henry_dsr_agent = "." }
include-package-data = true

[tool.setuptools.package-data]
henry_dsr_agent = ["api/static/*", "api/static/assets/*", "data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
exclude = ["tests/"]
