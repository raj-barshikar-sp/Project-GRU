[project]
name = "gru-marketing"
version = "0.1.0"
description = "Marketing agents POC: seven domain orchestrators under one root, on Google ADK"
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-adk[a2a]>=1.0.0",
    "pydantic>=2.0",
    "python-pptx>=0.6.23",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "google-api-core>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]
asyncio_mode = "auto"
markers = [
    "live: touches the real Agent Registry; needs ADC and BATTLECARD_AGENT_ID",
]
